<script>
  // Simple interactive micro-behaviors
  (function() {
    const phoneInput = document.getElementById('phone-input');
    const clearBtn = document.getElementById('btn-clear-phone');
    const agreementBox = document.getElementById('agreement-checkbox');
    const checkboxIcon = document.getElementById('checkbox-icon');
    const getCodeBtn = document.getElementById('btn-get-code');

    // Toggle clear button on phone typing
    if (phoneInput && clearBtn) {
      phoneInput.addEventListener('input', (e) => {
        if (e.target.value.length > 0) {
          clearBtn.classList.remove('opacity-0');
        } else {
          clearBtn.classList.add('opacity-0');
        }
      });
      clearBtn.addEventListener('click', () => {
        phoneInput.value = '';
        clearBtn.classList.add('opacity-0');
        phoneInput.focus();
      });
    }

    // Agreement toggle
    let agreed = true;
    if (agreementBox && checkboxIcon) {
      agreementBox.addEventListener('click', () => {
        agreed = !agreed;
        agreementBox.setAttribute('aria-checked', agreed ? 'true' : 'false');
        if (agreed) {
          agreementBox.classList.remove('bg-surface-variant');
          agreementBox.classList.add('bg-primary');
          checkboxIcon.classList.remove('hidden');
        } else {
          agreementBox.classList.remove('bg-primary');
          agreementBox.classList.add('bg-surface-variant');
          checkboxIcon.classList.add('hidden');
        }
      });
    }

    // Countdown button feedback demo
    if (getCodeBtn) {
      getCodeBtn.addEventListener('click', () => {
        if (getCodeBtn.dataset.running) return;
        const phone = phoneInput ? phoneInput.value.trim() : '';
        if (phone.length < 11) {
          phoneInput && phoneInput.focus();
          return;
        }
        getCodeBtn.dataset.running = 'true';
        let countdown = 60;
        getCodeBtn.classList.add('opacity-60', 'pointer-events-none');
        getCodeBtn.textContent = `${countdown}s 后重发`;
        const timer = setInterval(() => {
          countdown--;
          if (countdown <= 0) {
            clearInterval(timer);
            delete getCodeBtn.dataset.running;
            getCodeBtn.classList.remove('opacity-60', 'pointer-events-none');
            getCodeBtn.textContent = '获取验证码';
          } else {
            getCodeBtn.textContent = `${countdown}s 后重发`;
          }
        }, 1000);
      });
    }
  })();
